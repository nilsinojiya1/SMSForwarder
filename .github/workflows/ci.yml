name: CI Build Verification

on:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify Compilation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Fast Gradle Engine
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true  # Don't write to cache, only read
          gradle-home-cache-cleanup: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Debug Build & Unit Tests
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx5120m -XX:+UseParallelGC" \
            -x lintVitalRelease

