name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Custom Version Name (e.g., 1.0.2). Leave empty for auto-generation."
        required: false
        default: ""
      send_email:
        description: "Send Release Email with APK attachment"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Dynamic Version Code & Name
        id: versioning
        run: |
          # Calculate monotonically increasing Version Code
          VERSION_CODE="${{ github.run_number }}"
          
          # Calculate Version Name
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
          fi
          
          echo "Computed VERSION_CODE: $VERSION_CODE"
          echo "Computed VERSION_NAME: $VERSION_NAME"
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore JKS
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> $GITHUB_ENV
            echo "Keystore successfully decoded."
          else
            echo "No KEYSTORE_BASE64 secret provided. Proceeding without custom signing."
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK & Bundle
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          fi

      - name: Upload Build Artifacts (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SMSForwarder-v${{ env.VERSION_NAME }}-build
          path: release_artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "SMS Forwarder v${{ env.VERSION_NAME }}"
          body: |
            ## 🚀 SMS Forwarder Release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            
            ### 📦 Changes in this release
            - **Commit:** `${{ github.sha }}`
            - **Triggered by:** `${{ github.actor }}`
            - **Branch/Tag:** `${{ github.ref_name }}`
            
            ### ⬇️ Download
            - **APK (Direct Install):** `SMSForwarder-v${{ env.VERSION_NAME }}.apk`
            - **AAB (Play Store Bundle):** `SMSForwarder-v${{ env.VERSION_NAME }}.aab`
          files: |
            release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
            release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release Email with APK
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        if: ${{ (github.event.inputs.send_email == 'true' || github.event.inputs.send_email == '' || github.event_name == 'push') && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 SMS Forwarder v${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }}) Released"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || format('SMS Forwarder CI <{0}>', secrets.MAIL_USERNAME) }}
          html_body: |
            <h2>📱 SMS Forwarder v${{ env.VERSION_NAME }} is Ready!</h2>
            <p>A new release build has been compiled and signed successfully.</p>
            <ul>
              <li><strong>Version Name:</strong> ${{ env.VERSION_NAME }}</li>
              <li><strong>Version Code:</strong> ${{ env.VERSION_CODE }}</li>
              <li><strong>Commit:</strong> <code>${{ github.sha }}</code></li>
              <li><strong>Triggered By:</strong> ${{ github.actor }}</li>
            </ul>
            <p>The signed release APK is attached to this email for direct installation.</p>
            <p><a href="https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION_NAME }}">View on GitHub Releases</a></p>
          attachments: release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
