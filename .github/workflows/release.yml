name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Custom Version Name (e.g. 1.0.0). Leave empty for auto-generation."
        required: false
        default: ""
      play_track:
        description: "Google Play Track (alpha for Closed Testing, internal, beta, production)"
        required: false
        default: "alpha"

# Concurrency: Cancel in-flight duplicate runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Fast Build Signed Release & Dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Fast Gradle Engine
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          cache-disabled: true  # Skip caching when services are unstable

      - name: Calculate Semantic Version
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)|BREAKING CHANGE:"
          minor_pattern: "(MINOR)|feat:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true

      - name: Calculate Version Code & Final Version Name
        id: versioning
        run: |
          # 1. Monotonically increasing integer Version Code for Android OS updates
          VERSION_CODE="${{ github.run_number }}"
          
          # 2. Semantic Version Name (e.g. 1.0.0)
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="${{ steps.semver.outputs.version }}"
          fi
          
          # Ensure fallback if version is empty
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          
          echo "Generated VERSION_CODE: $VERSION_CODE"
          echo "Generated VERSION_NAME: $VERSION_NAME"
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore JKS
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> $GITHUB_ENV
            echo "Keystore successfully decoded."
          else
            echo "No KEYSTORE_BASE64 secret provided."
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: High-Speed Release Assembly (APK + AAB)
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Build both APK (:app:assembleRelease) and Play Store Bundle (:app:bundleRelease)
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --build-cache \
            --parallel \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx5120m -XX:+UseParallelGC" \
            -x lint -x test -x lintVitalRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts

          # Copy APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
          else
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

          # Copy AAB (Bundle)
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          elif [ -f app/build/outputs/bundle/release/app-release-unsigned.aab ]; then
            cp app/build/outputs/bundle/release/app-release-unsigned.aab release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          else
            echo "::error::Release AAB bundle not found in app/build/outputs/bundle/release/"
            exit 1
          fi

          echo "Prepared artifacts:"
          ls -lh release_artifacts/

      - name: Upload Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: SMSForwarder-v${{ env.VERSION_NAME }}
          path: release_artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "SMS Forwarder v${{ env.VERSION_NAME }}"
          body: |
            ## 🚀 SMS Forwarder v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            
            - **Commit:** `${{ github.sha }}`
            - **Author:** `${{ github.actor }}`
            
            ### ⬇️ Downloads
            - 📱 **Direct APK (Direct Install):** [`SMSForwarder-v${{ env.VERSION_NAME }}.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/SMSForwarder-v${{ env.VERSION_NAME }}.apk)
            - 📦 **Play Store Bundle (AAB):** [`SMSForwarder-v${{ env.VERSION_NAME }}.aab`](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/SMSForwarder-v${{ env.VERSION_NAME }}.aab)
          files: |
            release_artifacts/*.apk
            release_artifacts/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Google Play (Closed Testing)
        if: ${{ secrets.PLAY_CONFIG_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: online.thensoji.smsforwarder
          releaseFiles: release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          track: ${{ github.event.inputs.play_track || 'alpha' }}
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt


