name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Custom Version Name (e.g. 26.85.0). Leave empty for auto-generation."
        required: false
        default: ""
      send_email:
        description: "Send Release Email with APK attachment"
        type: boolean
        required: true
        default: true
      build_bundle:
        description: "Also build Play Store Bundle (.aab) [Slower]"
        type: boolean
        required: false
        default: false

# Concurrency: Cancel in-flight duplicate runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Fast Build Signed Release & Dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Fast Shallow Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Fast Gradle Engine
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          cache-disabled: true  # ADD THIS LINE to skip caching when services are unstable

      - name: Calculate Version Code & Dynamic Version Name (year.monthweek.build)
        id: versioning
        run: |
          # 1. Monotonically increasing integer Version Code for Android OS updates
          VERSION_CODE="${{ github.run_number }}"
          
          # 2. Dynamic Version Name Formula: year.monthweek.build (e.g. 26.85.0)
          YEAR=$(date +'%y')
          MONTH=$(date +'%-m')
          DAY=$(date +'%-d')
          WEEK=$(( (DAY - 1) / 7 + 1 ))
          
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            # Format: 26.85.0 (year.month_numberweek_number.build_number)
            VERSION_NAME="${YEAR}.${MONTH}${WEEK}.0"
          fi
          
          echo "Generated VERSION_CODE: $VERSION_CODE"
          echo "Generated VERSION_NAME: $VERSION_NAME"
          
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore JKS
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> $GITHUB_ENV
            echo "Keystore successfully decoded."
          else
            echo "No KEYSTORE_BASE64 secret provided."
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: High-Speed Release Assembly
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_BUNDLE: ${{ github.event.inputs.build_bundle }}
        run: |
          # Build target: assembleRelease for instant fast APK build, optionally bundleRelease if requested
          GRADLE_TASKS=":app:assembleRelease"
          if [ "$BUILD_BUNDLE" = "true" ]; then
            GRADLE_TASKS="$GRADLE_TASKS :app:bundleRelease"
          fi
          
          ./gradlew $GRADLE_TASKS \
            --build-cache \
            --parallel \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx5120m -XX:+UseParallelGC" \
            -x lint -x test -x lintVitalRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.aab
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "SMS Forwarder v${{ env.VERSION_NAME }}"
          body: |
            ## 🚀 SMS Forwarder v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
            
            - **Commit:** `${{ github.sha }}`
            - **Author:** `${{ github.actor }}`
            
            ### ⬇️ Download
            - **Direct APK:** [`SMSForwarder-v${{ env.VERSION_NAME }}.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}/SMSForwarder-v${{ env.VERSION_NAME }}.apk)
          files: release_artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release Email with APK
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        if: ${{ (github.event.inputs.send_email == 'true' || github.event.inputs.send_email == '' || github.event_name == 'push') && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 SMS Forwarder v${{ env.VERSION_NAME }} Released"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || format('SMS Forwarder CI <{0}>', secrets.MAIL_USERNAME) }}
          html_body: |
            <h2>📱 SMS Forwarder v${{ env.VERSION_NAME }} is Ready!</h2>
            <p>Your signed release build has finished compiling.</p>
            <ul>
              <li><strong>Version:</strong> ${{ env.VERSION_NAME }} (Build #${{ env.VERSION_CODE }})</li>
              <li><strong>Commit:</strong> <code>${{ github.sha }}</code></li>
            </ul>
            <p>Attached is your signed release APK for instant installation.</p>
            <p><a href="https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION_NAME }}">View GitHub Release</a></p>
          attachments: release_artifacts/SMSForwarder-v${{ env.VERSION_NAME }}.apk
