# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with tuned memory.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED

# ==============================================================================
# Build Speed & Caching Optimizations
# ==============================================================================
# Enable Gradle task output build caching across builds
org.gradle.caching=true

# Execute tasks and decoupled modules in parallel
org.gradle.parallel=true

# Enable Virtual File System watching for faster up-to-date checks
org.gradle.vfs.watch=true

# ==============================================================================
# Kotlin & KSP Incremental Compilation
# ==============================================================================
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
ksp.incremental=true
ksp.incremental.intermodule=true

# ==============================================================================
# Android Build Optimizations
# ==============================================================================
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
kotlin.code.style=official
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ==============================================================================
# Application Version Defaults (Used for local builds, overridden by CI)
# ==============================================================================
versionCode=1
versionName=1.0.0